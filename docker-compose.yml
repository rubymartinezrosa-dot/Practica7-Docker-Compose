services:

  app:
    build: .
    container_name: hola_mundo_app
    ports:
      - "8081:80"
    environment:
      DB_HOST: mysql
      DB_USER: appuser
      DB_PASSWORD: app123
      DB_NAME: holamundo
    depends_on:
      mysql:
        condition: service_healthy
    restart: unless-stopped

  mysql:
    image: mysql:8.4
    container_name: hola_mundo_mysql
    environment:
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_DATABASE: holamundo
      MYSQL_USER: appuser
      MYSQL_PASSWORD: app123
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$${MYSQL_ROOT_PASSWORD}\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

volumes:
  mysql_data: